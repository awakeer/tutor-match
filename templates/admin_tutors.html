<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老师列表 - 管理后台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav>
  <span class="brand">管理后台</span>
  <div class="nav-links"><a href="/admin">仪表盘</a><a href="/">返回首页</a></div>
</nav>

<div class="container">
<h2 style="margin-bottom:20px">注册老师</h2>

<div class="admin-nav">
  <a href="/admin/import">LLM 拆单入库</a>
  <a href="/admin/orders">订单管理</a>
  <a href="/admin/applications">申请管理</a>
  <a href="/admin/tutors" class="active">老师列表</a>
</div>

{% if tutors %}
<table class="card">
<thead>
<tr>
  <th>ID</th><th>用户名</th><th>姓名</th><th>手机</th><th>注册时间</th>
</tr>
</thead>
<tbody>
{% for t in tutors %}
<tr>
  <td>{{ t.id }}</td>
  <td>{{ t.username }}</td>
  <td>{{ t.real_name }}</td>
  <td>{{ t.phone }}</td>
  <td>{{ t.created_at[:10] }}</td>
</tr>
{% endfor %}
</tbody>
</table>
{% else %}
<div class="empty"><p>暂无注册老师</p></div>
{% endif %}

</div>
</body>
</html>
